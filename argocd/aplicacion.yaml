apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medicops-estado
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Armandoj1/gitops-medicops-demo.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: medicops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
